version: '3.9'

services:
  db:
    image: mysql:8
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: substring_back
    ports:
      - "3307:3306"
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapp -psecret --silent" ]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: >
      bash -c "./entrypoint.sh"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
        - DJANGO_ENV=production
    networks:
      - backend

  nginx:
    image: nginx:latest
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - backend

volumes:
  mysql_data:
  static_volume:
  media_volume:

networks:
  backend: